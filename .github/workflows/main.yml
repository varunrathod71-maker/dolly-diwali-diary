
name: Build Dolly's Diwali Diary APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Find Android project and build APK
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -type f \
            -path '*/android/settings.gradle' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android project not found."
            echo "The complete project ZIP contents must be uploaded."
            echo "Folders currently in the repository:"
            find . -maxdepth 4 -type d -print | head -100
            exit 1
          fi

          ANDROID_DIR="${SETTINGS_FILE%/settings.gradle}"
          PROJECT_DIR="$(dirname "$ANDROID_DIR")"

          if [ ! -f "$ANDROID_DIR/app/build.gradle" ]; then
            echo "::error::Android app build.gradle is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/www/index.html" ]; then
            echo "::error::www/index.html is missing beside the Android folder."
            exit 1
          fi

          echo "Android project found: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dolly-diwali-diary-debug-apk
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
          
